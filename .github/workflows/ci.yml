# Лестница проверок из README, слово в слово: `:app:test`, а рядом —
# сборка пакета. Пакет стоит в том же прогоне не для красоты: тесты
# не трогают ни jpackage, ни ресурсы, и «собирается» ломается отдельно
# от «работает».
name: проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: тесты и пакет
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ядро — соседним каталогом, как в README. Здесь «рядом» значит
      # внутри рабочего каталога, поэтому путь называем свойством.
      - name: ядро
        uses: actions/checkout@v5
        with:
          repository: sharap/ratatosk-core
          path: ratatosk-core

      # Две версии нарочно: 25 просит демон Gradle
      # (gradle/gradle-daemon-jvm.properties), 17 — компиляция и jpackage.
      # Без первой Gradle скачивал бы её сам на каждом прогоне.
      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17
          cache: gradle

      # Версия и компоненты объявлены в rust-toolchain.toml ядра;
      # `rustup show` их и ставит.
      - name: тулчейн Rust
        working-directory: ratatosk-core
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ratatosk-core

      # Две разные нужды в одной установке.
      #
      # `libdbus-1-dev` — ядру: на Linux tools/build-desktop.sh сам
      # добавляет признак `bt` (эфир поверх BlueZ), а `bluer` тянет
      # libdbus-sys, которому нужны заголовки. Без них cargo падает
      # на тысячной строке лога, когда всё остальное уже собралось.
      #
      # `fakeroot` — jpackage: им он делает .deb, и без него задача
      # падает в конце, а не в начале. `binutils` и `zstd` — правке
      # зависимостей пакета: она переписывает control внутри архива.
      - name: системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config fakeroot binutils zstd

      # Ядро собирается из исходников той же задачей, что и локально:
      # библиотека и привязки к ней — часть сборки, а не артефакт в репозитории.
      #
      # Вывод сохраняется: лог прогона GitHub отдаёт только тем, у кого
      # есть права на репозиторий, а причину падения надо знать и снаружи.
      - name: тесты
        run: |
          set -o pipefail
          ./gradlew :app:test -Pratatosk.core.dir=ratatosk-core 2>&1 | tee -a gradle.log

      - name: пакет
        run: |
          set -o pipefail
          ./gradlew :app:packageDeb -Pratatosk.core.dir=ratatosk-core 2>&1 | tee -a gradle.log

      # Что упало — в аннотации: они видны на странице проверок любому,
      # а «exit code 1» не объясняет ничего. Сперва имена упавших
      # проверок, а если отчёта нет вовсе — хвост сборки: значит
      # сломалась она, а не проверка.
      - name: что упало
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          def annotate(title, text):
              text = text.replace('%', '%25').replace('\r', ' ').replace('\n', '%0A')
              print(f"::error title={title}::{text[:1500]}")

          bad = []
          for f in glob.glob('app/build/test-results/test/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      name = f"{case.get('classname','?').split('.')[-1]}.{case.get('name','?')}"
                      bad.append((name, (fail.get('message') or fail.text or '').strip()))

          for name, message in bad[:10]:
              annotate(name, message)

          if not bad and os.path.exists('gradle.log'):
              with open('gradle.log', errors='replace') as log:
                  annotate('Последние строки сборки', ''.join(log.readlines()[-40:]))
          PY

      # Собранное можно потрогать руками, не собирая у себя. Две недели —
      # чтобы не копить: раздаём мы не отсюда, а из выпусков.
      - name: сохранить пакет
        uses: actions/upload-artifact@v4
        with:
          name: ratatosk-deb
          path: app/build/compose/binaries/main/deb/*.deb
          retention-days: 14
